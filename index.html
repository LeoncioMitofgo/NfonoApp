<section id="schools">
    <h2>School Management</h2>
    <form id="addSchoolForm">
        <input type="text" id="schoolName" placeholder="School Name" required />
        <input type="text" id="schoolAddress" placeholder="School Address" required />
        <button type="submit">Add School</button>
    </form>
    <table id="schoolsTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Address</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- Dynamically populated rows will go here -->
        </tbody>
    </table>
    <div id="editSchoolModal" style="display:none;">
        <h3>Edit School</h3>
        <form id="editSchoolForm">
            <input type="hidden" id="editSchoolId" />
            <input type="text" id="editSchoolName" required />
            <input type="text" id="editSchoolAddress" required />
            <button type="submit">Save Changes</button>
            <button type="button" onclick="closeModal()">Cancel</button>
        </form>
    </div>
</section>
